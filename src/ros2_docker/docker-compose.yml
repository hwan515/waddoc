services:
  ros2_humble:
    build: .
    container_name: ros2_dev_env
    restart: unless-stopped
    network_mode: "host"
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - MQTT_BROKER_HOST=www.waddoc.site
      - MQTT_BROKER_PORT=443
      - MQTT_WS_PATH=/mqtt
      - VEHICLE_ID=${VEHICLE_ID:-veh_GIMCHEON_01}
      - UNITY_CAM_RTSP_URL=${UNITY_CAM_RTSP_URL:-rtsp://www.waddoc.site:8554/unity_cam}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./workspace:/root/workspace:rw
    command: tail -f /dev/null
    depends_on:
      - mediamtx
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu, video, compute, utility ]

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx_server
    network_mode: "host"
    environment:
      - MTX_WEBRTCICEUDP=yes
      - MTX_WEBRTCADDITIONALHOSTS=${MEDIAMTX_WEBRTC_PUBLIC_HOST:-127.0.0.1}
    restart: unless-stopped
