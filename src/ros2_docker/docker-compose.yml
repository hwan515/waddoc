services:
  ros2_humble:
    build: .
    container_name: ros2_dev_env
    network_mode: "host"
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      - ROS_LOCALHOST_ONLY=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./workspace:/root/workspace:rw
    command: tail -f /dev/null
    depends_on:
      - mediamtx
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu, video, compute, utility ]

  zenoh_bridge:
    image: eclipse/zenoh-bridge-ros2dds:1.7.2
    container_name: zenoh_bridge
    environment:
      - ROS_DISTRO=humble
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_LOCALHOST_ONLY=1
    network_mode: "host"
    command: [ "-e", "tcp/3.34.123.145:8081" ]
    restart: unless-stopped

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx_server
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"
    environment:
      # 1. UDP를 완전히 끄고 TCP만 강제함
      - MTX_WEBRTCICEUDP=no
      # 2. TURN 서버 정보를 문자열 하나로 주입 (v1.x 표준)
      - MTX_WEBRTCICESERVERS_0=ssafy:12341234@3.34.123.145:3478?transport=tcp
    restart: unless-stopped
