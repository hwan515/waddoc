server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.waddoc.domain.dispatch.event,com.waddoc.domain.notification.event,com.waddoc.domain.notification.dto,com.waddoc.domain.mission.event
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

app:
  public-id:
    length: 8
  demo-mode:
    enabled: ${APP_DEMO_MODE_ENABLED:false}

dispatch:
  outbox-relay-interval-ms: 1000
