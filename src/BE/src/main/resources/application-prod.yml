spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/waddoc
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 900
  refresh-token-expiry: 604800

ai:
  file-transfer-mode: multipart
  idv-url: ${AI_IDV_URL}
  stt-url: ${AI_STT_URL}

file:
  storage-root: ${FILE_STORAGE_ROOT:/data/uploads}

sms:
  provider: solapi
  api-key: ${SOLAPI_API_KEY}
  api-secret: ${SOLAPI_API_SECRET}
  sender-number: ${SOLAPI_SENDER_NUMBER}

livekit:
  host: ${LIVEKIT_HOST}
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
  url: ${LIVEKIT_URL}

server:
  servlet:
    session:
      cookie:
        secure: true
