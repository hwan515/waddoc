server:
  port: ${SERVER_PORT:8080}

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,prometheus

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  autoconfigure:
    # BFF는 컨트롤러 내부 JWT 검증과 프록시 전달만 사용하므로 기본 사용자 생성 자동설정은 끈다.
    exclude: org.springframework.boot.autoconfigure.security.reactive.ReactiveUserDetailsServiceAutoConfiguration
  codec:
    max-in-memory-size: 10MB

springdoc:
  api-docs:
    path: /swagger/edge-bff/openapi.json
  swagger-ui:
    path: /swagger/edge-bff
    url: /swagger/edge-bff/openapi.json
    disable-swagger-default-url: true

upstream:
  core-app: ${CORE_APP_URI:http://core-app:8080}
  notification-service: ${NOTIFICATION_SERVICE_URI:http://notification-service:8080}
  robot-gateway: ${ROBOT_GATEWAY_URI:http://robot-gateway:8080}
