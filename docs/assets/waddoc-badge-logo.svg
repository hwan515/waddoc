<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Waddoc Badge Logo</title>
  <desc id="desc">Circular Waddoc logo with a W mark, medical cross, and route line.</desc>

  <style>
    .ring {
      fill: #0e7c86;
    }

    .inner {
      fill: #ffffff;
    }

    .mark {
      fill: none;
      stroke: #153a52;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .cross {
      fill: #69d6c4;
    }

    .route {
      fill: none;
      stroke: #0e7c86;
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <circle class="ring" cx="50" cy="50" r="50" />
  <circle class="inner" cx="50" cy="50" r="42" />

  <g aria-hidden="true">
    <path
      class="mark"
      d="M28 43 L35 59 L43 47 L50 58 L57 47 L65 59 L72 43"
    />

    <g class="cross" transform="translate(50 31)">
      <rect x="-2" y="-6" width="4" height="12" rx="2" />
      <rect x="-6" y="-2" width="12" height="4" rx="2" />
    </g>

    <path
      class="route"
      d="M41 70 C45 67, 55 67, 59 70"
    />
  </g>
</svg>
