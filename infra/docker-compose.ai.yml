services:
  # === AI - IDV (본인확인) ===
  idv-ai:
    build: ../src/AI/idv
    ports:
      - "8000:8000"
    environment:
      - FILE_STORAGE_ROOT=/data/uploads
      - FILE_RECEIVE_MODE=multipart
    volumes:
      - ai_uploads:/data/uploads
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'

  # === AI - STT ===
  stt-ai:
    build: ../src/AI/stt
    ports:
      - "8001:8001"
    environment:
      - FILE_STORAGE_ROOT=/data/uploads
      - FILE_RECEIVE_MODE=multipart
    volumes:
      - ai_uploads:/data/uploads
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4.0'

volumes:
  ai_uploads:
