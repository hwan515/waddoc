services:
  # === Reverse Proxy (SSL Termination) ===
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - spring-api
      - frontend
      - livekit
    # deploy: # 리소스 제한
    #   resources:
    #     limits:
    #       memory: 128M
    #       cpus: '0.5'
    networks:
      - waddoc-net

  # === Frontend ===
  frontend:
    build:
      context: ../src/FE
      args:
        - VITE_API_URL=/api
    expose:
      - "3000"
    # deploy: # 리소스 제한
    #   resources:
    #     limits:
    #       memory: 256M
    #       cpus: '0.5'
    networks:
      - waddoc-net

  # === Backend ===
  spring-api:
    build: ../src/BE
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AI_IDV_URL=https://${PROD_GPU_SERVER_HOST}/idv/api/v1/verify
      - AI_STT_WS_URL=wss://${PROD_GPU_SERVER_HOST}/stt/ws/transcribe
      - AI_TRIAGE_URL=https://${PROD_GPU_SERVER_HOST}/triage/api/v1/recommend
      - FILE_STORAGE_ROOT=/data/uploads
      - AI_IDV_TRANSFER_MODE=multipart
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_HOST=http://livekit:7880
      - LIVEKIT_URL=wss://${SERVER_DOMAIN}/livekit
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - uploads:/data/uploads
    depends_on:
      - postgres
      - redis
    # deploy: # 리소스 제한
    #   resources:
    #     limits:
    #       memory: 1G
    #       cpus: '2.0'
    networks:
      - waddoc-net

  # === Database ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    expose:
      - "5432"
    # deploy: # 리소스 제한
    #   resources:
    #     limits:
    #       memory: 1G
    #       cpus: '1.0'
    #     reservations:
    #       memory: 512M
    networks:
      - waddoc-net

  # === Cache ===
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    # deploy: # 리소스 제한
    #   resources:
    #     limits:
    #       memory: 256M
    #       cpus: '0.5'
    networks:
      - waddoc-net

  # === WebRTC ===
  livekit:
    image: livekit/livekit-server:latest
    expose:
      - "7880"
    ports:
      - "8881:7881"
      - "8882:7882/udp"
      - "8478:3478/udp"
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      - LIVEKIT_KEYS=${LIVEKIT_API_KEY}:${LIVEKIT_API_SECRET}
      - LIVEKIT_CONFIG=/etc/livekit.yaml
    # deploy: # 리소스 제한
    #   resources:
    #     limits:
    #       memory: 1G
    #       cpus: '1.0'
    networks:
      - waddoc-net

volumes:
  pg_data:
  redis_data:
  uploads:


networks:
  waddoc-net:
    driver: bridge
