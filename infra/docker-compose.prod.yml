# Waddoc 운영 환경 Docker Compose
# 이미지는 DockerHub에서 pull (Jenkinsfile에서 빌드 & push)
# 환경 변수는 infra/.env 파일에서 로드 (커밋 X)
# 실행: docker compose -f docker-compose.prod.yml up -d

services:
  # === Reverse Proxy (SSL Termination) ===
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ${CERTS_DIR:-/home/ubuntu/.waddoc/certs}:/etc/nginx/certs:ro # SSL 인증서는 repo 밖 경로를 사용
    depends_on:
      - spring-api
      - frontend
      - frontend-phone
      - livekit
    restart: unless-stopped
    networks:
      - waddoc-net

  # === Frontend (Web) — 의사/관리자용 웹 앱 ===
  frontend:
    image: ${DOCKER_IMAGE_FE:-waddoc-frontend}:${FE_IMAGE_TAG:-latest} # Jenkinsfile에서 태그 주입
    expose:
      - "3000"
    restart: unless-stopped
    networks:
      - waddoc-net

  # === Frontend (Phone) — 환자용 모바일 웹 앱 ===
  frontend-phone:
    image: ${DOCKER_IMAGE_FP:-waddoc-phone}:${FP_IMAGE_TAG:-latest} # Jenkinsfile에서 태그 주입
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - waddoc-net

  # === Backend (Spring Boot) ===
  spring-api:
    image: ${DOCKER_IMAGE_BE:-waddoc-backend}:${BE_IMAGE_TAG:-latest} # Jenkinsfile에서 태그 주입
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - AI_IDV_URL=https://${PROD_GPU_SERVER_HOST}/idv/api/v1/verify
      - AI_TRIAGE_URL=https://${PROD_GPU_SERVER_HOST}/triage/api/v1/recommend
      - FILE_STORAGE_ROOT=/data/uploads
      - AI_IDV_TRANSFER_MODE=multipart
      - CONSULTATION_IDENTITY_CHECK_BYPASS_ENABLED=${CONSULTATION_IDENTITY_CHECK_BYPASS_ENABLED:-false} # AI IDV 서버 미준비 시에만 임시로 본인 확인을 우회
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_HOST=http://livekit:7880
      - LIVEKIT_URL=wss://${SERVER_DOMAIN}/livekit
      - JWT_SECRET=${JWT_SECRET}
      - MISSION_TERMINAL_TOKEN_EXPIRY=${MISSION_TERMINAL_TOKEN_EXPIRY:-1800}
      - SOLAPI_API_KEY=${SOLAPI_API_KEY}
      - SOLAPI_API_SECRET=${SOLAPI_API_SECRET}
      - SOLAPI_SENDER_NUMBER=${SOLAPI_SENDER_NUMBER}
      - TELEMETRY_API_KEY=${TELEMETRY_API_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    volumes:
      - uploads:/data/uploads
    depends_on:
      - postgres
      - redis
      - kafka
    restart: unless-stopped
    networks:
      - waddoc-net

  # === Database ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # SSH 터널용(운영 DB 접속)
    expose:
      - "5432"
    restart: unless-stopped
    networks:
      - waddoc-net

  # === Cache ===
  redis:
    image: redis:7-alpine
    # --notify-keyspace-events Ex : 키 만료 이벤트 활성화 (세션/토큰 만료 감지용)
    command: redis-server --requirepass ${REDIS_PASSWORD} --notify-keyspace-events Ex
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    restart: unless-stopped
    networks:
      - waddoc-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
    restart: unless-stopped
    networks:
      - waddoc-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "${KAFKA_PORT:-8092}:9092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_CLIENT_PORT:-2181}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_PORT:-8092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-false}"
    depends_on:
      - zookeeper
    restart: unless-stopped
    networks:
      - waddoc-net

  # === WebRTC (LiveKit) — 화상 진료 시그널링 서버 ===
  livekit:
    image: livekit/livekit-server:latest
    command: [ "--config", "/etc/livekit.yaml" ]
    expose:
      - "7880"
    ports:
      - "8881:7881" # TCP (클라이언트 시그널링)
      - "8882:7882/udp" # UDP (미디어 스트림)
      - "8478:3478/udp" # TURN 서버
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    restart: unless-stopped
    networks:
      - waddoc-net

  # === Zenoh (ROS2 메시지 라우터) — 로봇 통신 브릿지 ===
  zenoh:
    image: eclipse/zenoh:1.7.2
    profiles: [ "zenoh" ] # 수동 운영 중일 때는 기본 배포 대상에서 제외 (Todo: 합치면 삭제)
    ports:
      - "8081:8081" # Zenoh REST/WebSocket 포트
    volumes:
      - ../src/BE/zenoh-server/router/zenoh.json5:/zenoh.json5:ro
    command: [ "-c", "/zenoh.json5" ]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - waddoc-net

  # === Zenoh Subscriber — Zenoh 메시지를 수신하여 처리하는 앱 ===
  zenoh-subscriber:
    build: ../src/BE/zenoh-server/router_app # 로컬 빌드 (DockerHub X)
    profiles: [ "zenoh" ] # zenoh profile을 명시적으로 켤 때만 함께 기동 (Todo: 합치면 삭제)
    depends_on:
      - zenoh
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - waddoc-net

volumes:
  pg_data:
  redis_data:
  uploads:


networks:
  waddoc-net:
    driver: bridge
