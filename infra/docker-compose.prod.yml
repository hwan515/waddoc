# Waddoc 운영 환경 Docker Compose
# 이미지는 DockerHub에서 pull (Jenkinsfile에서 빌드 & push)
# 환경 변수는 infra/.env 파일에서 로드 (커밋 X)
# 실행: docker compose -f docker-compose.prod.yml up -d

services:
  # === Reverse Proxy (SSL Termination) ===
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx/prod.conf:/etc/nginx/nginx.conf:ro
      - ${CERTS_DIR:-/home/ubuntu/.waddoc/certs}:/etc/nginx/certs:ro # SSL 인증서는 repo 밖 경로를 사용
    depends_on:
      - edge-bff
      - core-app
      - frontend
      - frontend-phone
      - livekit
    restart: unless-stopped
    networks:
      - waddoc-net

  # === Frontend (Web) — 의사/관리자용 웹 앱 ===
  frontend:
    image: ${DOCKER_IMAGE_FE:-hwan515/waddoc-frontend}:${FE_IMAGE_TAG:?FE_IMAGE_TAG is required} # 운영 앱 이미지는 latest 대신 불변 태그를 사용한다.
    expose:
      - "3000"
    environment:
      - VITE_ROBOT_TERMINAL_ID=${VITE_ROBOT_TERMINAL_ID:-}
      - VITE_ROBOT_TERMINAL_KEY=${VITE_ROBOT_TERMINAL_KEY:-}
      - VITE_DEMO_MODE_ENABLED=${APP_DEMO_MODE_ENABLED:-false}
      - VITE_ACTIVE_OPERATOR_VEHICLE_ID=${VITE_ACTIVE_OPERATOR_VEHICLE_ID:-veh_GIMCHEON_01}
      - VITE_ENABLE_MONITORING_TAB=${VITE_ENABLE_MONITORING_TAB:-true}
      - UNITY_CAM_PROXY_TARGET=${UNITY_CAM_PROXY_TARGET:-http://mediamtx:8889/unity_cam}
    restart: unless-stopped
    networks:
      - waddoc-net

  mediamtx:
    image: bluenviron/mediamtx:1
    expose:
      - "8889"
    ports:
      - "8554:8554"
      - "8189:8189/tcp"
      - "8189:8189/udp"
    environment:
      - MTX_RTSPTRANSPORTS=tcp
      - MTX_WEBRTCADDITIONALHOSTS=${MEDIAMTX_WEBRTC_PUBLIC_HOST:?MEDIAMTX_WEBRTC_PUBLIC_HOST is required}
      - MTX_WEBRTCLOCALTCPADDRESS=:8189
    restart: unless-stopped
    networks:
      - waddoc-net

  # === Frontend (Phone) — 환자용 모바일 웹 앱 ===
  frontend-phone:
    image: ${DOCKER_IMAGE_FP:-hwan515/waddoc-phone}:${FP_IMAGE_TAG:?FP_IMAGE_TAG is required} # 운영 앱 이미지는 latest 대신 불변 태그를 사용한다.
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - waddoc-net

  # === Backend (Spring Boot) ===
  edge-bff:
    image: ${DOCKER_IMAGE_EDGE_BFF:-hwan515/waddoc-edge-bff}:${EDGE_BFF_IMAGE_TAG:?EDGE_BFF_IMAGE_TAG is required}
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - CORE_APP_URI=http://core-app:8080
      - NOTIFICATION_SERVICE_URI=http://notification-service:8080
      - ROBOT_GATEWAY_URI=http://robot-gateway:8080
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - core-app
      - notification-service
      - robot-gateway
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped
    networks:
      - waddoc-net

  core-app:
    image: ${DOCKER_IMAGE_CORE_APP:-hwan515/waddoc-backend}:${CORE_APP_IMAGE_TAG:?CORE_APP_IMAGE_TAG is required} # 운영 앱 이미지는 latest 대신 불변 태그를 사용한다.
    expose:
      - "8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - CORE_REDIS_PASSWORD=${CORE_REDIS_PASSWORD}
      - AI_IDV_URL=${AI_IDV_URL:-https://${PROD_GPU_SERVER_HOST}/idv/api/v1/verify}
      - AI_IDV_TIMEOUT_MS=${AI_IDV_TIMEOUT_MS:-5000}
      - FILE_STORAGE_ROOT=/data/uploads
      - AI_IDV_TRANSFER_MODE=multipart
      - APP_DEMO_MODE_ENABLED=${APP_DEMO_MODE_ENABLED:-false}
      # 더미 데이터 추가
      - APP_SEED_ENABLED=${APP_SEED_ENABLED:-false}
      - APP_SEED_DEFAULT_PASSWORD=${APP_SEED_DEFAULT_PASSWORD}
      - CONSULTATION_IDENTITY_CHECK_BYPASS_ENABLED=${CONSULTATION_IDENTITY_CHECK_BYPASS_ENABLED:-false} # AI IDV 서버 미준비 시에만 임시로 본인 확인을 우회
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - LIVEKIT_HOST=http://livekit:7880
      - LIVEKIT_URL=wss://${SERVER_DOMAIN}/livekit
      - JWT_SECRET=${JWT_SECRET}
      - MONITORING_COOKIE_SECRET=${MONITORING_COOKIE_SECRET:?MONITORING_COOKIE_SECRET is required}
      - MISSION_TERMINAL_TOKEN_EXPIRY=${MISSION_TERMINAL_TOKEN_EXPIRY:-1800}
      - SOLAPI_API_KEY=${SOLAPI_API_KEY}
      - SOLAPI_API_SECRET=${SOLAPI_API_SECRET}
      - SOLAPI_SENDER_NUMBER=${SOLAPI_SENDER_NUMBER}
      - TELEMETRY_API_KEY=${TELEMETRY_API_KEY}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - ROBOT_TERMINAL_REGISTRY=${ROBOT_TERMINAL_REGISTRY:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      - postgres
      - redis
      - kafka
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped
    networks:
      - waddoc-net

  notification-service:
    image: ${DOCKER_IMAGE_NOTIFICATION:-hwan515/waddoc-notification}:${NOTIFICATION_IMAGE_TAG:?NOTIFICATION_IMAGE_TAG is required}
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - NOTIFICATION_DB_HOST=notification-postgres
      - NOTIFICATION_DB_USER=${NOTIFICATION_DB_USER:-waddoc}
      - NOTIFICATION_DB_PASSWORD=${NOTIFICATION_DB_PASSWORD}
      - REDIS_HOST=notification-redis
      - REDIS_PORT=6379
      - NOTIFICATION_REDIS_PASSWORD=${NOTIFICATION_REDIS_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - JWT_SECRET=${JWT_SECRET}
      - SOLAPI_API_KEY=${SOLAPI_API_KEY}
      - SOLAPI_API_SECRET=${SOLAPI_API_SECRET}
      - SOLAPI_SENDER_NUMBER=${SOLAPI_SENDER_NUMBER}
      - SMS_CONTACT_NUMBER=${SMS_CONTACT_NUMBER:-029302266}
    depends_on:
      - notification-postgres
      - notification-redis
      - kafka
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - waddoc-net

  robot-gateway:
    image: ${DOCKER_IMAGE_ROBOT_GATEWAY:-hwan515/waddoc-robot-gateway}:${ROBOT_GATEWAY_IMAGE_TAG:?ROBOT_GATEWAY_IMAGE_TAG is required}
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - REDIS_HOST=robot-redis
      - REDIS_PORT=6379
      - ROBOT_REDIS_PASSWORD=${ROBOT_REDIS_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      - MQTT_BROKER_URL=ws://mosquitto:9001
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-robot-gateway-prod}
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - robot-redis
      - kafka
      - mosquitto
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - waddoc-net

  # === Database ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432" # SSH 터널용(운영 DB 접속)
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - waddoc-net

  notification-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waddoc_notification
      POSTGRES_USER: ${NOTIFICATION_DB_USER:-waddoc}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - notification_pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432" # SSH 터널용(notification DB 접속)
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NOTIFICATION_DB_USER:-waddoc} -d waddoc_notification"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - waddoc-net

  # === Cache (service-owned) ===
  redis:
    image: redis:7-alpine
    # --notify-keyspace-events Ex : 키 만료 이벤트 활성화 (세션/토큰 만료 감지용)
    command:
      - redis-server
      - --requirepass
      - ${CORE_REDIS_PASSWORD}
      - --notify-keyspace-events
      - Ex
    environment:
      REDISCLI_AUTH: ${CORE_REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - waddoc-net

  notification-redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${NOTIFICATION_REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${NOTIFICATION_REDIS_PASSWORD}
    volumes:
      - notification_redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - waddoc-net

  robot-redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${ROBOT_REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${ROBOT_REDIS_PASSWORD}
    volumes:
      - robot_redis_data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    networks:
      - waddoc-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}
    restart: unless-stopped
    networks:
      - waddoc-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "${KAFKA_PORT:-8092}:9092"
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID:-1}
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_CLIENT_PORT:-2181}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_EXTERNAL_HOST:-localhost}:${KAFKA_PORT:-8092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: ${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:-1}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "${KAFKA_AUTO_CREATE_TOPICS_ENABLE:-false}"
    depends_on:
      - zookeeper
    restart: unless-stopped
    networks:
      - waddoc-net

  # === WebRTC (LiveKit) — 화상 진료 시그널링 서버 ===
  livekit:
    image: livekit/livekit-server:latest
    entrypoint: ["/bin/sh", "/etc/entrypoint.sh"]
    expose:
      - "7880"
    ports:
      - "8881:8881" # TCP fallback for WebRTC media
      - "8882:8882/udp" # UDP media
    volumes:
      - ./livekit/livekit.yaml:/etc/livekit.yaml.tpl:ro
      - ./livekit/entrypoint.sh:/etc/entrypoint.sh:ro
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_NODE_IP: "${LIVEKIT_NODE_IP}"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_WEBHOOK_URL: "${LIVEKIT_WEBHOOK_URL:-http://core-app:8080/api/v1/sessions/webhook/livekit}"
      TURN_SECRET: "${TURN_SECRET}"
    restart: unless-stopped
    networks:
      - waddoc-net

  # === TURN Server (coturn) — NAT 통과용 릴레이 ===
  coturn:
    image: coturn/coturn:latest
    network_mode: host
    command: >
      -n
      --listening-port=8478
      --min-port=8600
      --max-port=8699
      --lt-cred-mech
      --user=waddoc:${TURN_SECRET}
      --realm=turn.waddoc.com
      --external-ip=${LIVEKIT_NODE_IP}
      --no-tls
      --no-dtls
      --no-cli
      --fingerprint
    restart: unless-stopped

  # === MQTT Broker (Mosquitto) — 차량 통신 브로커 ===
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    expose:
      - "9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped
    networks:
      - waddoc-net

volumes:
  pg_data:
  redis_data:
  notification_redis_data:
  robot_redis_data:
  uploads:
  notification_pg_data:
  mosquitto_data:
  mosquitto_log:


networks:
  waddoc-net:
    driver: bridge
