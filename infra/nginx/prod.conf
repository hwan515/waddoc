events {
    worker_connections 1024;
}

http {
    # Docker Compose 내부 DNS — scale된 컨테이너를 동적으로 resolve
    resolver 127.0.0.11 valid=10s;

    # Canonical domain redirect
    server {
        listen 80;
        server_name waddoc.site;
        return 301 https://www.waddoc.site$request_uri;
    }

    # HTTP → HTTPS redirect for canonical host
    server {
        listen 80;
        server_name www.waddoc.site;
        return 301 https://$host$request_uri;
    }

    # Canonical domain redirect
    server {
        listen 443 ssl;
        server_name waddoc.site;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://www.waddoc.site$request_uri;
    }

    # HTTPS
    server {
        listen 443 ssl;
        server_name www.waddoc.site;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 20M;

        # Phone frontend
        location = /phone {
            set $phone_app frontend-phone:3001;
            proxy_pass http://$phone_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /phone/ {
            return 301 /phone;
        }

        location /phone/ {
            set $phone_app frontend-phone:3001;
            rewrite ^/phone/(.*)$ /$1 break;
            proxy_pass http://$phone_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Doctor notification SSE → Spring Boot
        location = /api/v1/doctors/me/notifications/stream {
            set $spring_api spring-api:8080;
            proxy_pass http://$spring_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no always;
        }

        # Zenoh Router (로봇 커맨드)
        location /api/cmd/ {
            proxy_pass http://3.34.123.145:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API → Spring Boot
        location /api/ {
            set $spring_api spring-api:8080;
            proxy_pass http://$spring_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # LiveKit signaling WebSocket (SSL termination)
        location /livekit/ {
            set $livekit_ws livekit:7880;
            rewrite ^/livekit/(.*)$ /$1 break;
            proxy_pass http://$livekit_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # React frontend
        location / {
            set $frontend_app frontend:3000;
            proxy_pass http://$frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
