events {
    worker_connections 1024;
}

http {
    # Docker Compose 내부 DNS를 사용해 확장된 컨테이너 이름을 동적으로 해석
    resolver 127.0.0.11 valid=10s;

    # 대표 도메인으로 리다이렉트
    server {
        listen 80;
        server_name waddoc.site;
        return 301 https://www.waddoc.site$request_uri;
    }

    # 대표 호스트에 대해 HTTP를 HTTPS로 리다이렉트
    server {
        listen 80;
        server_name www.waddoc.site;
        return 301 https://$host$request_uri;
    }

    # 대표 도메인으로 리다이렉트
    server {
        listen 443 ssl;
        server_name waddoc.site;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        return 301 https://www.waddoc.site$request_uri;
    }

    # HTTPS 서버
    server {
        listen 443 ssl;
        server_name www.waddoc.site;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        client_max_body_size 20M;

        # 휴대폰 프론트엔드
        location = /phone {
            set $phone_app frontend-phone:3001;
            proxy_pass http://$phone_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /phone/ {
            return 301 /phone;
        }

        location /phone/ {
            set $phone_app frontend-phone:3001;
            rewrite ^/phone/(.*)$ /$1 break;
            proxy_pass http://$phone_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Spring용 Swagger UI와 OpenAPI
        location = /swagger/spring {
            set $spring_api spring-api:8080;
            proxy_pass http://$spring_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /swagger/spring/ {
            return 301 /swagger/spring;
        }

        location = /swagger/spring/openapi.json {
            set $spring_api spring-api:8080;
            proxy_pass http://$spring_api/swagger/spring/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger/spring/ {
            set $spring_api spring-api:8080;
            proxy_pass http://$spring_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # FastAPI용 Swagger UI와 OpenAPI
        location = /swagger/fastapi {
            proxy_pass http://host.docker.internal:8000/swagger/fastapi;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /swagger/fastapi/ {
            return 301 /swagger/fastapi;
        }

        location /swagger/fastapi/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Springdoc이 /swagger/spring 을 /swagger/swagger-ui/index.html 로 리다이렉트할 수 있다.
        # 나머지 /swagger/* 경로도 모두 Spring 앱으로 보내서 React가 가로채지 않게 한다.
        location /swagger/ {
            set $spring_api spring-api:8080;
            proxy_pass http://$spring_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 기존 Swagger 경로를 새 공개 경로로 리다이렉트
        location = /swagger-ui.html {
            return 301 /swagger/spring;
        }

        location = /swagger-ui {
            return 301 /swagger/spring;
        }

        location /swagger-ui/ {
            return 301 /swagger/spring;
        }

        location = /v3/api-docs {
            return 301 /swagger/spring/openapi.json;
        }

        location /v3/api-docs/ {
            return 301 /swagger/spring/openapi.json;
        }

        location = /v3/api-docs.yaml {
            return 301 /swagger/spring/openapi.json;
        }

        location = /docs {
            return 301 /swagger/fastapi;
        }

        location = /docs/ {
            return 301 /swagger/fastapi;
        }

        location = /openapi.json {
            return 301 /swagger/fastapi/openapi.json;
        }

        location = /redoc {
            return 301 /swagger/fastapi;
        }

        location = /_monitoring_auth {
            internal;
            set $spring_api spring-api:8080;
            proxy_pass http://$spring_api/api/v1/admin/monitoring/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Cookie $http_cookie;
        }

        location = /_monitoring_forbidden {
            internal;
            return 403;
        }

        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            auth_request /_monitoring_auth;
            error_page 401 403 =403 /_monitoring_forbidden;
            set $grafana grafana:3000;
            proxy_pass http://$grafana;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /grafana;
            proxy_buffering off;
        }
        # 의사 알림 SSE를 Spring Boot로 전달
        location = /api/v1/doctors/me/notifications/stream {
            set $spring_api spring-api:8080;
            proxy_pass http://$spring_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no always;
        }

        # ROS2 minimap/command API를 host network FastAPI로 프록시
        location = /api/minimap {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location = /api/odom {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/cmd/ {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 일반 API를 Spring Boot로 전달
        location /api/ {
            set $spring_api spring-api:8080;
            proxy_pass http://$spring_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # LiveKit 시그널링 WebSocket (SSL 종료)
        location /livekit/ {
            set $livekit_ws livekit:7880;
            rewrite ^/livekit/(.*)$ /$1 break;
            proxy_pass http://$livekit_ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # React 프론트엔드
        location / {
            set $frontend_app frontend:3000;
            proxy_pass http://$frontend_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
