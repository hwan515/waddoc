services:
  # === Reverse Proxy ===
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - spring-api
      - frontend
      - frontend-phone
      - livekit
    networks:
      - waddoc-net

  # === Frontend ===
  frontend:
    build: ../src/FE
    expose:
      - "3000"
    environment:
      - VITE_ROBOT_TERMINAL_ID=${VITE_ROBOT_TERMINAL_ID:-}
      - VITE_ROBOT_TERMINAL_KEY=${VITE_ROBOT_TERMINAL_KEY:-}
    networks:
      - waddoc-net

  # === Frontend (Phone) ===
  frontend-phone:
    build: ../src/FE-phone
    expose:
      - "3001"
    networks:
      - waddoc-net

  # === Backend ===
  spring-api:
    build: ../src/BE
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret}
      - LIVEKIT_HOST=http://livekit:7880
      - AI_IDV_URL=http://${DEV_GPU_SERVER_HOST}/idv/api/v1/verify
      - AI_IDV_TIMEOUT_MS=${AI_IDV_TIMEOUT_MS:-20000}
      - FILE_STORAGE_ROOT=/data/uploads
      - AI_IDV_TRANSFER_MODE=multipart
      - APP_SEED_ENABLED=${APP_SEED_ENABLED:-true}
      - APP_SEED_DEFAULT_PASSWORD=${APP_SEED_DEFAULT_PASSWORD:-Passw0rd!}
      - ROBOT_TERMINAL_REGISTRY=${ROBOT_TERMINAL_REGISTRY:-}
    volumes:
      - ./local-storage/uploads:/data/uploads
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - waddoc-net

  # === Database ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waddoc
      POSTGRES_USER: waddoc
      POSTGRES_PASSWORD: waddoc_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # 추후 배포할떄는 expose로 변경
      - "5432:5432"
    networks:
      - waddoc-net

  # === Cache ===
  redis:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - waddoc-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - waddoc-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    depends_on:
      - zookeeper
    networks:
      - waddoc-net

  # === WebRTC ===
  livekit:
    image: livekit/livekit-server:latest
    entrypoint: [ "/bin/sh", "/etc/entrypoint.sh" ]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "3478:3478/udp"
    volumes:
      - ./livekit/livekit.local.yaml:/etc/livekit.yaml.tpl:ro
      - ./livekit/entrypoint.sh:/etc/entrypoint.sh:ro
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-devsecret}"
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
      LIVEKIT_WEBHOOK_URL: "${LIVEKIT_WEBHOOK_URL:-http://spring-api:8080/api/v1/sessions/webhook/livekit}"
    networks:
      - waddoc-net

  # === Zenoh (ROS2 메시지 라우터) — 선택 프로필 ===
  zenoh:
    image: eclipse/zenoh:1.7.2
    profiles: [ "zenoh" ]
    ports:
      - "8081:8081"
    volumes:
      - ../src/BE/zenoh-server/router/zenoh.json5:/zenoh.json5:ro
    command: [ "-c", "/zenoh.json5" ]
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - waddoc-net

  # === Zenoh Subscriber — 선택 프로필 ===
  zenoh-subscriber:
    build: ../src/BE/zenoh-server/router_app
    profiles: [ "zenoh" ]
    depends_on:
      - zenoh
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - waddoc-net

volumes:
  pg_data:
  redis_data:


networks:
  waddoc-net:
    driver: bridge
