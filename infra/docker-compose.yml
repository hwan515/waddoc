services:
  # === Reverse Proxy ===
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/dev.conf.template:/etc/nginx/nginx.conf:ro
    depends_on:
      - edge-bff
      - core-app
      - frontend
      - frontend-phone
      - livekit
    networks:
      - waddoc-net

  # === Frontend ===
  frontend:
    build: ../src/FE
    expose:
      - "3000"
    environment:
      - VITE_DEMO_MODE_ENABLED=${APP_DEMO_MODE_ENABLED:-true}
      - VITE_ROBOT_TERMINAL_ID=${VITE_ROBOT_TERMINAL_ID:-}
      - VITE_ROBOT_TERMINAL_KEY=${VITE_ROBOT_TERMINAL_KEY:-}
      - VITE_ACTIVE_OPERATOR_VEHICLE_ID=${VITE_ACTIVE_OPERATOR_VEHICLE_ID:-veh_GIMCHEON_01}
      - VITE_ENABLE_MONITORING_TAB=${VITE_ENABLE_MONITORING_TAB:-false}
      - UNITY_CAM_PROXY_TARGET=${UNITY_CAM_PROXY_TARGET:-http://mediamtx:8889/unity_cam}
    networks:
      - waddoc-net

  mediamtx:
    image: bluenviron/mediamtx:1
    expose:
      - "8889"
    ports:
      - "8554:8554"
      - "8189:8189/tcp"
      - "8189:8189/udp"
    environment:
      - MTX_RTSPTRANSPORTS=tcp
      - MTX_WEBRTCADDITIONALHOSTS=${MEDIAMTX_WEBRTC_PUBLIC_HOST:-127.0.0.1}
      - MTX_WEBRTCLOCALTCPADDRESS=:8189
    networks:
      - waddoc-net

  # === Frontend (Phone) ===
  frontend-phone:
    build: ../src/FE-phone
    expose:
      - "3001"
    networks:
      - waddoc-net

  # === Backend ===
  edge-bff:
    build:
      context: ../src/BE
      args:
        MODULE_NAME: edge-bff
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - CORE_APP_URI=http://core-app:8080
      - NOTIFICATION_SERVICE_URI=http://notification-service:8080
      - ROBOT_GATEWAY_URI=http://robot-gateway:8080
      - JWT_SECRET=${JWT_SECRET:-waddoc-dev-secret-key-must-be-at-least-32-chars-long}
    depends_on:
      - core-app
      - notification-service
      - robot-gateway
    networks:
      - waddoc-net

  core-app:
    build:
      context: ../src/BE
      args:
        MODULE_NAME: core-app
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - DB_HOST=postgres
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-devsecret}
      - LIVEKIT_HOST=http://livekit:7880
      - AI_IDV_URL=http://${DEV_GPU_SERVER_HOST}/idv/api/v1/verify
      - AI_IDV_TIMEOUT_MS=${AI_IDV_TIMEOUT_MS:-20000}
      - CONSULTATION_IDENTITY_CHECK_BYPASS_ENABLED=${CONSULTATION_IDENTITY_CHECK_BYPASS_ENABLED:-false}
      - FILE_STORAGE_ROOT=/data/uploads
      - AI_IDV_TRANSFER_MODE=multipart
      - APP_DEMO_MODE_ENABLED=${APP_DEMO_MODE_ENABLED:-true}
      - APP_SEED_ENABLED=${APP_SEED_ENABLED:-true}
      - APP_SEED_DEFAULT_PASSWORD=${APP_SEED_DEFAULT_PASSWORD}
      - ROBOT_TERMINAL_REGISTRY=${ROBOT_TERMINAL_REGISTRY:-}
      - JWT_SECRET=${JWT_SECRET:-waddoc-dev-secret-key-must-be-at-least-32-chars-long}
      - TELEMETRY_API_KEY=${TELEMETRY_API_KEY:-telemetry-dev-key}
    volumes:
      - ./local-storage/uploads:/data/uploads
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - waddoc-net

  notification-service:
    build:
      context: ../src/BE
      args:
        MODULE_NAME: notification-service
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - NOTIFICATION_DB_HOST=notification-postgres
      - NOTIFICATION_DB_PORT=5432
      - REDIS_HOST=notification-redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - JWT_SECRET=${JWT_SECRET:-waddoc-dev-secret-key-must-be-at-least-32-chars-long}
      - SMS_CONTACT_NUMBER=${SMS_CONTACT_NUMBER:-01000000000}
    depends_on:
      - notification-postgres
      - notification-redis
      - kafka
    networks:
      - waddoc-net

  robot-gateway:
    build:
      context: ../src/BE
      args:
        MODULE_NAME: robot-gateway
    expose:
      - "8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - REDIS_HOST=robot-redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - MQTT_BROKER_URL=${MQTT_BROKER_URL:-ws://mosquitto:9001}
      - MQTT_CLIENT_ID=${MQTT_CLIENT_ID:-robot-gateway-dev}
      - JWT_SECRET=${JWT_SECRET:-waddoc-dev-secret-key-must-be-at-least-32-chars-long}
    depends_on:
      - robot-redis
      - kafka
      - mosquitto
    networks:
      - waddoc-net

  # === Database ===
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waddoc
      POSTGRES_USER: waddoc
      POSTGRES_PASSWORD: waddoc_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # 추후 배포할떄는 expose로 변경
      - "5432:5432"
    networks:
      - waddoc-net

  notification-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: waddoc_notification
      POSTGRES_USER: waddoc
      POSTGRES_PASSWORD: waddoc_notification_dev
    volumes:
      - notification_pg_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - waddoc-net

  # === Cache (service-owned) ===
  redis:
    image: redis:7-alpine
    command: redis-server --notify-keyspace-events Ex
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - waddoc-net

  notification-redis:
    image: redis:7-alpine
    command: redis-server
    ports:
      - "6380:6379"
    volumes:
      - notification_redis_data:/data
    networks:
      - waddoc-net

  robot-redis:
    image: redis:7-alpine
    command: redis-server
    ports:
      - "6381:6379"
    volumes:
      - robot_redis_data:/data
    networks:
      - waddoc-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - waddoc-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    depends_on:
      - zookeeper
    networks:
      - waddoc-net

  mosquitto:
    image: eclipse-mosquitto:2
    expose:
      - "9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - waddoc-net

  # === WebRTC ===
  livekit:
    image: livekit/livekit-server:latest
    entrypoint: [ "/bin/sh", "/etc/entrypoint.sh" ]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "3478:3478/udp"
    volumes:
      - ./livekit/livekit.local.yaml:/etc/livekit.yaml.tpl:ro
      - ./livekit/entrypoint.sh:/etc/entrypoint.sh:ro
    environment:
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY:-devkey}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET:-devsecret}"
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-devkey}: ${LIVEKIT_API_SECRET:-devsecret}"
      LIVEKIT_WEBHOOK_URL: "${LIVEKIT_WEBHOOK_URL:-http://core-app:8080/api/v1/sessions/webhook/livekit}"
    networks:
      - waddoc-net

volumes:
  pg_data:
  redis_data:
  notification_redis_data:
  robot_redis_data:
  notification_pg_data:
  mosquitto_data:
  mosquitto_log:


networks:
  waddoc-net:
    driver: bridge
